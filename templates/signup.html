<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>WaterPulse - AI-Based Water Intelligence System</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wdth,wght@0,75..100,300..800;1,75..100,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="../static/lib/animate/animate.min.css" rel="stylesheet">
    <link href="../static/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">


    <!-- Customized Bootstrap Stylesheet -->
    <link href="../static/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="../static/css/style.css" rel="stylesheet">
</head>

<body>

    <!-- Spinner Start -->
    <div id="spinner"
        class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!-- Spinner End -->

    <!-- Navbar & Hero Start -->
    <div class="container-fluid position-relative p-0">
        <nav class="navbar navbar-expand-lg navbar-light px-4 px-lg-5 py-3 py-lg-0">
            <a href="" class="navbar-brand p-0">
                <h1 class="text-primary"><i class="fas fa-hand-holding-water me-3"></i>WaterPulse</h1>
                <!-- <img src="../static/img/logo.png" alt="Logo"> -->
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="fa fa-bars"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav ms-auto py-0">
                    <a href="/" class="nav-item nav-link"><i class="fas fa-home me-2"></i>Home</a>
                    <a href="/login" class="nav-item nav-link"><i class="fas fa-sign-in-alt me-2"></i>SignIn</a>
                    <a href="/logon" class="nav-item nav-link active"><i class="fas fa-user-plus me-2"></i>Register</a>
                </div>
            </div>
        </nav>

        <!-- Carousel Start -->
<div class="carousel-header">
    <div id="carouselId" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="../static/img/water-3.jpg" class="img-fluid w-100"style="height:1000px; object-fit:cover;alt="Image">

                <div class="carousel-caption d-flex justify-content-center align-items-center" style="height:100%; padding-top:200px;">

                    <div class="card auth-card shadow-lg border-0 rounded-4 p-4 text-start"
                        style="width:500px; background:rgba(252,250,246,0.97); border: 1px solid #EDE8DE !important;">

                        <div class="text-center mb-4">
                            <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                            <h2 class="fw-bold text-primary">WaterPulse</h2>
                            <p class="text-muted mb-0">
                                Create Your Account
                            </p>
                        </div>

                        <form action="/signup" method="POST">

                            <!-- Username -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-user-tag text-primary me-2"></i>Username
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-primary border-end-0">
                                        <i class="fas fa-user-tag"></i>
                                    </span>
                                    <input type="text"
                                           class="form-control form-control-lg border-start-0"
                                           name="user"
                                           placeholder="Enter Username"
                                           required>
                                </div>
                            </div>

                            <!-- Full Name -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-id-card text-primary me-2"></i>Full Name
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-primary border-end-0">
                                        <i class="fas fa-id-card"></i>
                                    </span>
                                    <input type="text"
                                           class="form-control form-control-lg border-start-0"
                                           name="name"
                                           placeholder="Enter Full Name"
                                           required>
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-envelope text-primary me-2"></i>Email Address
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-primary border-end-0">
                                        <i class="fas fa-envelope"></i>
                                    </span>
                                    <input type="email"
                                           class="form-control form-control-lg border-start-0"
                                           name="email"
                                           placeholder="Enter Email Address"
                                           required>
                                </div>
                            </div>

                            <!-- Mobile -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-phone-alt text-primary me-2"></i>Mobile Number
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-primary border-end-0">
                                        <i class="fas fa-phone-alt"></i>
                                    </span>
                                    <input type="tel"
                                           class="form-control form-control-lg border-start-0"
                                           name="mobile"
                                           placeholder="Enter 10-digit Mobile Number"
                                           pattern="[0-9]{10}"
                                           required>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-lock text-primary me-2"></i>Password
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-primary border-end-0">
                                        <i class="fas fa-lock"></i>
                                    </span>
                                    <input type="password"
                                           class="form-control form-control-lg border-start-0"
                                           name="password"
                                           placeholder="Enter Password"
                                           required>
                                </div>
                            </div>

                            <!-- Register Button -->
                            <button type="submit"
                                    class="btn btn-primary w-100 py-3 fw-bold">
                                <i class="fas fa-user-plus me-2"></i>
                                Create Account
                            </button>

                            <!-- Login Link -->
                            <div class="text-center mt-3">
                                <span class="text-dark">
                                    Already have an account?
                                </span>
                                <a href="/login"
                                   class="text-primary fw-bold text-decoration-none">
                                    <i class="fas fa-sign-in-alt me-1"></i>Login
                                </a>
                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>
    </div>
</div>
<!-- Carousel End -->
    </div>
    <!-- Navbar & Hero End -->

    
    <!-- Copyright Start -->
    <div class="container-fluid copyright py-4">
        <div class="container">
            <div class="row g-4 align-items-center">
                <div class="col-md-6 text-center text-md-start mb-md-0">
                    <span class="text-body"><a href="#" class="border-bottom text-white"><i
                                class="fas fa-copyright text-light me-2"></i>WaterPulse</a>, All right
                        reserved.</span>
                </div>
                <div class="col-md-6 text-center text-md-end text-body">
                   
                    Designed By <a class="border-bottom text-white" href="#">AI-Based Water Intelligence System</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Copyright End -->


    <!-- Back to Top -->
    <a href="#" class="btn btn-secondary btn-lg-square rounded-circle back-to-top"><i class="fa fa-arrow-up"></i></a>


    <!-- JavaScript Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/lib/wow/wow.min.js"></script>
    <script src="../static/lib/easing/easing.min.js"></script>
    <script src="../static/lib/waypoints/waypoints.min.js"></script>
    <script src="../static/lib/counterup/counterup.min.js"></script>
    <script src="../static/lib/owlcarousel/owl.carousel.min.js"></script>


    <!-- Template Javascript -->
    <script src="../static/js/main.js"></script>
</body>

</html>
